    <p class=&quot;kicker&quot;>Der rote Faden</p><h2>1492 &amp;amp; die Entdecker</h2>
    <p>Ein Jahr verbindet fast alles. Anfang <b>1492</b> fällt in <b>Granada</b> das letzte muslimische Reich Europas – nach 780 Jahren. Dieselben Könige geben danach einem Träumer namens <b>Kolumbus</b> Geld. Im <b>August 1492</b> segelt er von der andalusischen Küste los und stößt auf Amerika.</p>
    <p>Ab da ist <b>Andalusien die Startrampe der Welt</b>: Von Sevilla und Cádiz aus wird ein halber Planet verwaltet. Fragt euch an jedem Ort: Was war hier um 1492?</p>
  </div>

    <div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><circle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;15&quot;/><path d=&quot;M20 5 v30 M5 20 h30&quot; stroke-width=&quot;1.4&quot;/><path d=&quot;M9 12 q11 6 22 0 M9 28 q11 -6 22 0&quot; stroke-width=&quot;1.2&quot;/></svg>
      <div><div class=&quot;cnum&quot;>KAPITEL 00</div><h2>Willkommen in Spanien</h2></div></div>
    <p class=&quot;intro&quot;>Für Beni &amp;amp; Maxi das erste Mal Spanien – hier das Wichtigste zum Land, zur Region Andalusien und wie die Leute hier ticken.</p>
    <div class=&quot;rule&quot;></div>

    <details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Spanien in Zahlen</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>Zweitgrößtes Land der EU – und eines der bergigsten Europas.</p>
      <ul class=&quot;facts&quot;><li><b>~49 Mio</b> Einwohner, Hauptstadt <b>Madrid</b>.</li><li><b>Königreich</b> mit König <b>Felipe VI.</b> – aber Regierung wie bei uns gewählt.</li><li>Nach der Schweiz eines der <b>gebirgigsten</b> Länder Europas (viel Hochebene, „Meseta&quot;).</li><li>17 „autonome Regionen&quot; – <b>Andalusien</b> ist eine davon, im tiefen Süden.</li><li>Zahlen mit <b>Euro</b>; Sprache <b>Español/Castellano</b>.</li></ul>
      <div class=&quot;note&quot;><span class=&quot;lbl&quot;>Gut zu wissen</span><p>Spanien tickt zeitlich anders: Mittagessen 14–15 Uhr, Abendessen oft erst 21–22 Uhr. Wir passen uns an.</p></div></div></details>

    <details><summary><span class=&quot;stype&quot;>Region</span><span class=&quot;stitle&quot;>Andalusien – was ist besonders</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>Das Postkarten-Spanien: Flamenco, weiße Dörfer, maurische Paläste.</p>
      <ul class=&quot;facts&quot;><li><b>~8,4 Mio</b> Einwohner in <b>8 Provinzen</b> – die <b>bevölkerungsreichste</b> Region Spaniens.</li><li>Geburtsort von <b>Flamenco</b>, <b>Tapas</b> und dem modernen <b>Stierkampf</b>.</li><li><b>800 Jahre</b> muslimische Prägung (711–1492) – daher die Paläste, Bögen und Gassen.</li><li>Über <b>300 Sonnentage</b> im Jahr; produziert einen <b>Großteil des Olivenöls der Welt</b>.</li><li>Zwei Küsten: <b>Costa de la Luz</b> (Atlantik, wild &amp;amp; windig – euer Tarifa) und <b>Costa del Sol</b> (Mittelmeer, ruhiger).</li></ul>
      <div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Wäre Andalusien ein eigenes Land, hätte es mehr Einwohner als Österreich.&quot;</p></div></div></details>

    <details><summary><span class=&quot;stype&quot;>Klima</span><span class=&quot;stitle&quot;>Wetter &amp;amp; Hitze</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>Der heißeste Teil Spaniens – und warum wir Siesta machen.</p>
      <ul class=&quot;facts&quot;><li>Im Landesinneren (Córdoba, Sevilla) klettert das Thermometer im Sommer oft über <b>40 °C</b>.</li><li>Sevilla heißt „<b>die Bratpfanne Europas</b>&quot; (sartén de Europa).</li><li>An der Küste (Tarifa, Cádiz) ist es durch den <b>Wind viel angenehmer</b>.</li><li>Deshalb die <b>Siesta</b>: mittags Pause im Schatten/Pool, abends wird's lebendig.</li></ul>
      <div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Immer Wasser, Sonnencreme, Kappe. Sightseeing lieber früh morgens oder abends – mittags Pool.</p></div></div></details>

    <details><summary><span class=&quot;stype&quot;>Leute</span><span class=&quot;stitle&quot;>Land &amp;amp; Leute</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>Laut, herzlich, familienverrückt – und immer etwas später dran.</p>
      <ul class=&quot;facts&quot;><li>Die Andalusier gelten als besonders <b>offen und gesellig</b> – Kinder sind überall willkommen, auch abends im Restaurant.</li><li>Das Leben spielt sich <b>draußen</b> ab: Plätze, Terrassen, Fiestas bis tief in die Nacht.</li><li>Der Dialekt „schluckt&quot; Endungen – selbst andere Spanier finden Andalusier schwer zu verstehen.</li><li>„<b>Mañana</b>&quot; (morgen) – hier hat man's selten eilig. Einfach mitfließen.</li></ul></div></details>

    <details><summary><span class=&quot;stype&quot;>Essen</span><span class=&quot;stitle&quot;>Tapas &amp;amp; Essenskultur</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>In Spanien isst man nicht jeder für sich – man teilt.</p>
      <ul class=&quot;facts&quot;><li><b>Tapas</b> = kleine Portionen zum Teilen; man bestellt viele und probiert alles durch.</li><li><b>Menú del día</b>: günstiges 3-Gänge-Mittagsmenü mit Getränk – Spaniens bestes Preis-Leistungs-Geheimnis.</li><li>Klassiker: <b>Jamón</b> (luftgetrockneter Schinken), <b>Tortilla</b> (Kartoffel-Omelett), <b>Gazpacho/Salmorejo</b> (kalte Tomatensuppe).</li><li>Getränke: <b>Tinto de verano</b> (Rotwein + Limo), an der Küste <b>Sherry</b>, für die Jungs frische Säfte.</li></ul>
      <div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„‚Tapa' heißt Deckel – früher legte man Brot oder Schinken als Deckel aufs Weinglas, gegen Fliegen.&quot;</p></div></div></details>

    <details><summary><span class=&quot;stype&quot;>Sprache</span><span class=&quot;stitle&quot;>Spanisch für unterwegs</span><span class=&quot;chev&quot;>›</span></summary>
    <div class=&quot;body&quot;><p class=&quot;hook&quot;>Ein paar Wörter – und die Leute strahlen sofort.</p>
      <div class=&quot;phrases&quot;><span><b>Hola</b> · Hallo</span><span><b>Gracias</b> · Danke</span><span><b>Por favor</b> · Bitte</span><span><b>Buenos días</b> · Guten Tag</span><span><b>¿Qué tal?</b> · Wie geht's?</span><span><b>La cuenta</b> · die Rechnung</span><span><b>Una mesa para 4</b> · Tisch für 4</span><span><b>¿Dónde está…?</b> · Wo ist…?</span><span><b>Vale</b> · okay</span><span><b>Adiós</b> · Tschüss</span></div>
      <div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>„¿Habla inglés?&quot; – Spricht die Person Englisch? In Andalusien nicht selbstverständlich, ein paar Brocken Spanisch helfen enorm.</p></div></div></details>
  </section>
<section class=&quot;chapter&quot; id=&quot;madrid&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M8 34 V18 L20 9 L32 18 V34&quot;/><path d=&quot;M6 34 H34&quot;/><path d=&quot;M17 34 V26 H23 V34&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 01</div><h2>Madrid</h2></div></div><p class=&quot;intro&quot;>Spaniens Hauptstadt und mit Abstand größte Stadt – und die höchstgelegene Hauptstadt Europas.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Madrid</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Herz und Kopf Spaniens – hier laufen alle Fäden zusammen.</p><ul class=&quot;facts&quot;><li><b>~3,4 Mio</b> Einwohner in der Stadt, mit Umland fast <b>7 Mio</b> – die größte Stadt Spaniens.</li><li>Liegt auf <b>~667 m</b> Höhe – die <b>höchstgelegene Hauptstadt Europas</b>.</li><li>Seit <b>1561</b> Hauptstadt; Sitz von König und Regierung.</li><li>Ziemlich genau die <b>geografische Mitte</b> Spaniens – alle Straßen führen sternförmig hierher.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Madrid liegt im Landesinneren – Ende August tagsüber oft 35 °C+, aber trockene Hitze.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Platz</span><span class=&quot;stitle&quot;>Puerta del Sol – Kilometer 0</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Der Mittelpunkt Spaniens – im Boden eingelassen.</p><ul class=&quot;facts&quot;><li>Von dieser Bodenplatte werden <b>alle Entfernungen</b> Spaniens gemessen; hier starten die 6 großen Nationalstraßen.</li><li>Das Wappen Madrids steht hier: ein <b>Bär am Erdbeerbaum</b> (El Oso y el Madroño).</li><li>An Silvester essen Millionen zu den 12 Glockenschlägen <b>12 Trauben</b> – Glück für jeden Monat.</li><li>Die Uhr am Turm gibt diesen Takt für ganz Spanien vor (wie bei uns das Brandenburger Tor).</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Ich stehe am Nullpunkt Spaniens – jeder Kilometerstein im Land zählt ab hier.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Platz</span><span class=&quot;stitle&quot;>Plaza Mayor</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Ein Platz, der schon alles gesehen hat.</p><ul class=&quot;facts&quot;><li>Fertig <b>1620</b>, komplett umbaut, 237 Balkone.</li><li>War Markt, Krönungsbühne, Stierkampfarena – und Gerichtsplatz der <b>Inquisition</b>.</li><li>Dreimal abgebrannt und immer wieder aufgebaut.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Auf genau diesem Pflaster hielt die Inquisition ihre Schauprozesse ab.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Palast</span><span class=&quot;stitle&quot;>Königspalast</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>3.400 Zimmer – und niemand wohnt drin.</p><ul class=&quot;facts&quot;><li><b>Größter Königspalast Westeuropas</b> (~135.000 m²) – mehr Räume als Buckingham Palace und Versailles.</li><li>Steht auf den Resten einer <b>maurischen Festung</b> aus dem 9. Jh.</li><li>Der König nutzt ihn nur für Staatsakte; gewohnt wird außerhalb der Stadt (Zarzuela).</li><li>Drinnen: Thronsaal, eine der wenigen kompletten <b>Stradivari-Streichquartett</b>-Sammlungen der Welt.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Mehr Zimmer als Buckingham Palace – und der König schläft trotzdem woanders.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Tempel</span><span class=&quot;stitle&quot;>Templo de Debod</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Ein echter ägyptischer Tempel – mitten in Madrid.</p><ul class=&quot;facts&quot;><li>Über <b>2.200 Jahre alt</b>, stand ursprünglich am Nil.</li><li><b>Geschenk Ägyptens 1968</b> – Dank dafür, dass Spanien half, die Tempel von Abu Simbel vor dem Assuan-Stausee zu retten.</li><li>Wurde <b>Stein für Stein</b> abgebaut und nach Madrid verschifft.</li><li>Heute der beste <b>Sonnenuntergangs-Spot</b> der Stadt.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Der einzige echte Pharaonen-Tempel Spaniens – per Schiff aus Ägypten geliefert.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Platz</span><span class=&quot;stitle&quot;>Plaza de España (Madrid)</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wo Don Quijote in Bronze reitet.</p><ul class=&quot;facts&quot;><li>Großer Platz am Fuß des Wolkenkratzers Torre de Madrid.</li><li>Denkmal für <b>Cervantes</b> mit <b>Don Quijote &amp;amp; Sancho Panza</b> – Spaniens berühmtestem Roman.</li><li>Perfekt kombinierbar mit Debod nebenan.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Don Quijote gilt als der erste moderne Roman der Weltliteratur.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Straße</span><span class=&quot;stitle&quot;>Gran Vía</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Madrids „Broadway&quot; – nie schlafende Prachtstraße.</p><ul class=&quot;facts&quot;><li>Anfang des <b>20. Jh.</b> mitten durch die Altstadt geschlagen.</li><li>Kinos, Theater, Musicals, Shops – abends ein Lichtermeer.</li><li>Euer Apartment liegt hier – ideal für den Abendbummel.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Markt</span><span class=&quot;stitle&quot;>Mercado de San Miguel</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Kein normaler Markt – ein Schlemmer-Tempel.</p><ul class=&quot;facts&quot;><li>Schmiedeeiserne Markthalle von <b>1916</b>, komplett aus Glas &amp;amp; Eisen.</li><li>Heute lauter Tapas-Stände: Schinken, Oliven, Croquetas, frische Säfte.</li><li>Perfekt zum Durchprobieren – jeder holt sich, worauf er Lust hat.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Tipp</span><p>Nicht überladen bestellen – lieber an mehreren Ständen kleine Sachen teilen.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Stadion</span><span class=&quot;stitle&quot;>Santiago Bernabéu</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Das erfolgreichste Fußball-Wohnzimmer der Welt.</p><ul class=&quot;facts&quot;><li>Real Madrid: <b>15 Champions-League-Titel</b> – Rekord, kein Klub hat mehr.</li><li>Dazu <b>36 spanische Meistertitel</b> – ebenfalls Rekord.</li><li>Fasst nach dem Umbau ~<b>85.000</b> Zuschauer, mit einziehbarem Dach und versenkbarem Rasen.</li><li>Die „Galácticos&quot;: Zidane, Ronaldo, Beckham – heute Mbappé &amp;amp; Bellingham.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„15 Henkelpötte – Bayern und Barça zusammen haben weniger.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Was man in Madrid isst</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Deftig und fleischlastig – Binnenland eben.</p><ul class=&quot;facts&quot;><li><b>Cocido madrileño</b>: mächtiger Kichererbsen-Fleisch-Eintopf, in Gängen serviert.</li><li><b>Huevos rotos</b>: Spiegeleier über Pommes und Schinken – kindertauglich.</li><li><b>Bocadillo de calamares</b>: Tintenfischring-Sandwich, ein Madrid-Kult.</li><li>Nachtisch: <b>Churros con chocolate</b>, in dicke Schokolade getunkt.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Für Fez</span><p>Binnenland = wenig Fisch. Deinen Fisch-Nachholbedarf deckst du besser an der Küste (Tarifa/Cádiz).</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;cordoba&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M8 34 V20 a12 12 0 0 1 24 0 V34&quot;/><path d=&quot;M6 34 H34&quot;/><path d=&quot;M20 34 V22&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 02</div><h2>Córdoba</h2></div></div><p class=&quot;intro&quot;>Um das Jahr 1000 die größte und gebildetste Stadt Europas – heute ein UNESCO-Juwel am Fluss.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Córdoba</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Einst Weltstadt, heute beschauliche Schönheit.</p><ul class=&quot;facts&quot;><li><b>~320.000</b> Einwohner, am Fluss <b>Guadalquivir</b>.</li><li>War Hauptstadt des muslimischen <b>Kalifats von Córdoba</b> – um 1000 evtl. <b>größte Stadt Europas</b> (bis ~500.000 Menschen).</li><li>Damals: Straßenlaternen, fließend Wasser, riesige Bibliotheken – als der Rest Europas im Matsch stand.</li><li>Vier UNESCO-Welterbe-Titel – so viele wie keine andere Stadt der Welt.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Heißeste Stadt der Route – oft 40–42 °C. Pool-Siesta ist Pflicht.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Mezquita</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Eine Kathedrale, versteckt in einer Moschee.</p><ul class=&quot;facts&quot;><li>Ein <b>Wald aus 856 Säulen</b> mit rot-weißen Doppelbögen.</li><li>Über 1.000 Jahre Geschichte: erst Moschee, nach der Rückeroberung baute man eine <b>ganze Kathedrale mitten hinein</b>.</li><li>Der Mihrab (Gebetsnische) ist mit tonnenweise <b>byzantinischem Gold-Mosaik</b> verziert.</li><li>Sonntagvormittag geöffnet – aber vollster Tag, Ticket mit Zeitfenster.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Als man die Kathedrale reinbaute, klagte Kaiser Karl V.: ‚Ihr habt zerstört, was einzigartig war.’&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Viertel</span><span class=&quot;stitle&quot;>Judería</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Enge weiße Gassen – das alte jüdische Viertel.</p><ul class=&quot;facts&quot;><li>Labyrinth aus blumengeschmückten Gassen (Calleja de las Flores).</li><li>Hier wurde <b>Maimónides</b> geboren – einer der größten jüdischen Denker des Mittelalters; seine Statue steht hier.</li><li>Córdoba galt als Ort, an dem Muslime, Juden und Christen lange <b>nebeneinander</b> lebten.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Tipp</span><p>Am kühlen Abend am schönsten – tagsüber spenden die engen Gassen Schatten.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Brücke</span><span class=&quot;stitle&quot;>Römische Brücke</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>2.000 Jahre alt – und Filmstar.</p><ul class=&quot;facts&quot;><li>Steht seit der <b>Römerzeit</b> über dem Guadalquivir.</li><li>War in <b>Game of Thrones</b> die „Lange Brücke von Volantis&quot;.</li><li>Am schönsten zum Sonnenuntergang mit Blick zurück auf die Mezquita.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Über diese Brücke marschierten römische Legionen – und flogen GoT-Drachen.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Palast</span><span class=&quot;stitle&quot;>Alcázar de los Reyes Cristianos</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wo Kolumbus um sein Schiff bat.</p><ul class=&quot;facts&quot;><li>Festung/Palast der katholischen Könige mit <b>terrassierten Wassergärten</b>.</li><li>Hier empfingen Isabella &amp;amp; Ferdinand mehrfach <b>Kolumbus</b>, während sie den Krieg gegen Granada führten.</li><li>Später Sitz der <b>Inquisition</b> in Córdoba.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„In diesem Palast wurde mitverhandelt, ob Kolumbus je in See sticht.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Was man in Córdoba isst</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Kalt, cremig, deftig – perfekt bei 40 °C.</p><ul class=&quot;facts&quot;><li><b>Salmorejo</b>: dickere, cremigere Cousine des Gazpacho, mit Ei und Schinken – kalt &amp;amp; herrlich.</li><li><b>Flamenquín</b>: paniertes Schweinefleisch-Röllchen mit Schinken – Kinderliebling.</li><li><b>Rabo de toro</b>: geschmorter Ochsenschwanz, butterzart (kein Innereien!).</li><li><b>Berenjenas con miel</b>: frittierte Auberginen mit Zuckerrohr-Sirup.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Euer Tisch</span><p>Tablafina im Hotel ist gebucht – Flamenquín &amp;amp; Salmorejo sind hier der Klassiker.</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;sevilla&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M6 27 h28 l-4 6 H10 z&quot;/><path d=&quot;M20 27 V7&quot;/><path d=&quot;M20 9 h11 l-3 4 3 4 H20&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 03</div><h2>Sevilla</h2></div></div><p class=&quot;intro&quot;>Die viertgrößte Stadt Spaniens, Hauptstadt Andalusiens – Tor zur Neuen Welt und Heimat des Flamenco.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Sevilla</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Orangenduft, Hitze, Leidenschaft – die Seele Andalusiens.</p><ul class=&quot;facts&quot;><li><b>~680.000</b> Einwohner – <b>viertgrößte Stadt</b> Spaniens, Hauptstadt der Region.</li><li>Am <b>Guadalquivir</b>, dem einzigen großen schiffbaren Fluss Spaniens – daher der Reichtum aus Amerika.</li><li>Berühmt für <b>Flamenco</b>, die <b>Semana Santa</b> (Osterprozessionen) und die <b>Feria de Abril</b>.</li><li>Die Straßen sind voller <b>Bitterorangen-Bäume</b> (nur für Marmelade essbar).</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>„Bratpfanne Europas&quot; – 40 °C keine Seltenheit. Alcázar früh, mittags Pool, Plätze am Abend.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Kathedrale &amp;amp; Giralda</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Die größte gotische Kathedrale der Welt – und Kolumbus’ Grab.</p><ul class=&quot;facts&quot;><li>Das Grab von <b>Christoph Kolumbus</b> wird von 4 Königsfiguren getragen und schwebt in der Luft.</li><li>Ob wirklich <b>seine Knochen</b> drin liegen, wird bis heute per DNA gestritten – er wurde mehrfach umgebettet, sogar über den Atlantik.</li><li>Der Turm <b>Giralda</b> war ein Minarett – innen keine Treppe, sondern <b>Rampen</b> zum Hochreiten.</li><li>Erbaut, damit „die Nachwelt uns für verrückt hält&quot; – so groß wollten es die Bauherren.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Vier Könige tragen Kolumbus – und keiner weiß hundertprozentig, ob er’s wirklich ist.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Real Alcázar</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Ältester noch genutzter Königspalast Europas – und Dorne.</p><ul class=&quot;facts&quot;><li>Wird nach <b>über 1.000 Jahren</b> immer noch von der Königsfamilie genutzt.</li><li>Die <b>Casa de Contratación</b> hier verwaltete den <b>gesamten Amerika-Handel</b>.</li><li>Die Wassergärten waren in <b>Game of Thrones</b> der Palast von Dorne (Sonnenspeer).</li><li>Mudéjar-Stil: christliche Könige ließen von <b>muslimischen Meistern</b> bauen.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Hier drehte GoT Dorne – und nebenan wohnt echt noch der König, wenn er da ist.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Plaza de España</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Halbrund, mit Kanälen – und aus Star Wars.</p><ul class=&quot;facts&quot;><li>Gebaut <b>1928/29</b> für eine Weltausstellung.</li><li>War in <b>Star Wars (Episode II)</b> der Planet <b>Naboo</b>.</li><li>48 bunte Fliesenbänke – für jede spanische Provinz eine.</li><li>Man kann sogar <b>Ruderboote</b> auf dem Kanal mieten.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Anakin und Padmé schlenderten genau hier – nur digital nach Naboo verwandelt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Viertel</span><span class=&quot;stitle&quot;>Barrio Santa Cruz</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Verwinkeltes weißes Gassen-Labyrinth.</p><ul class=&quot;facts&quot;><li>Das alte <b>jüdische Viertel</b>, direkt an der Kathedrale.</li><li>Die Gassen sind absichtlich eng und krumm – <b>Schatten</b> und Verwirrung für Angreifer.</li><li>Versteckte Innenhöfe (Patios) voller Blumen und Brunnen.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Sightseeing</span><span class=&quot;stitle&quot;>Plaza de Toros (Maestranza)</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Eine der ältesten Stierkampfarenen Spaniens.</p><ul class=&quot;facts&quot;><li>Erbaut ab <b>1761</b>, eines der <b>ältesten</b> Rundstadien des Stierkampfs.</li><li>Fasst ~12.000 Zuschauer; gilt als eine der wichtigsten Arenen überhaupt.</li><li>Stierkampf ist <b>umstritten</b> – für die einen Kunst/Tradition, für viele Tierquälerei. Gut, das mit den Jungs zu besprechen.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Für die Diskussion</span><p>Man muss keinen Kampf sehen – die Arena &amp;amp; das Museum erklären Geschichte und Streit gut.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Park</span><span class=&quot;stitle&quot;>Parque de María Luisa</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Grüne, schattige Oase neben der Plaza de España.</p><ul class=&quot;facts&quot;><li>Sevillas großer Stadtpark – Palmen, Brunnen, Pavillons.</li><li>Ideale <b>Schatten-Pause</b> zwischen den Sehenswürdigkeiten.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Kultur</span><span class=&quot;stitle&quot;>Flamenco</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Nicht Tanz allein – ein Gefühlssturm.</p><ul class=&quot;facts&quot;><li>Entstand in Andalusien aus <b>Roma-, maurischen und andalusischen</b> Wurzeln.</li><li>Drei Teile: <b>Cante</b> (Gesang), <b>Baile</b> (Tanz), <b>Toque</b> (Gitarre) – dazu Klatschen (palmas).</li><li>Seit <b>2010 UNESCO-Weltkulturerbe</b>.</li><li>Das Ziel ist der „<b>duende</b>&quot; – ein magischer Moment, wenn alle Gänsehaut haben.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Wenn ein Flamenco-Sänger den ‚duende’ trifft, schreit das Publikum ‚¡Olé!’ – das kommt vom arabischen ‚Allah’.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Was man in Sevilla isst</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Welthauptstadt der Tapas.</p><ul class=&quot;facts&quot;><li><b>Espinacas con garbanzos</b>: Spinat mit Kichererbsen – maurisches Erbe, vegetarisch.</li><li><b>Serranito</b>: Sandwich mit Schwein, Schinken &amp;amp; Paprika.</li><li><b>Jamón ibérico de bellota</b>: Schinken von Eichel-gefütterten Schweinen – Weltklasse.</li><li>Getränk der Feria: <b>Rebujito</b> (Sherry + Zitronenlimo) – für die Großen.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Euer Plan</span><p>30.08. Leña al Lomo (Fleisch), 31.08. El Arenal als Dinner &amp;amp; Show – da isst du beim Flamenco.</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;ronda&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M6 14 h28 v20 h-28 z&quot;/><path d=&quot;M6 24 h28&quot;/><path d=&quot;M20 14 v-6&quot;/><path d=&quot;M14 34 v-6 a6 6 0 0 1 12 0 v6&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 04</div><h2>Ronda</h2></div></div><p class=&quot;intro&quot;>Ein kleines weißes Bergstädtchen, spektakulär auf zwei Felsen über einer tiefen Schlucht – Zwischenstopp auf dem Weg nach Tarifa.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Ronda</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Das dramatischste weiße Dorf Andalusiens.</p><ul class=&quot;facts&quot;><li><b>~35.000</b> Einwohner, auf <b>~750 m</b> Höhe.</li><li>Die Stadt ist von der Schlucht <b>El Tajo</b> (bis 120 m tief) in zwei Hälften gespalten.</li><li>Eines der ältesten Städtchen Spaniens; Rückzugsort für Künstler und Banditen.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Roadtrip</span><span class=&quot;stitle&quot;>Puente Nuevo &amp;amp; Arena</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wiege des modernen Stierkampfs, über dem Abgrund.</p><ul class=&quot;facts&quot;><li>Die „neue Brücke&quot; spannt <b>98 m</b> über die Schlucht (fertig 1793).</li><li>Ronda ist die <b>Geburtsstadt des modernen Stierkampfs</b> zu Fuß (Familie Romero, 18. Jh.).</li><li>Die Arena von 1785 ist eine der ältesten Spaniens.</li><li><b>Hemingway</b> und <b>Orson Welles</b> liebten Ronda – Welles ließ seine Asche hier verstreuen.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Hier wurde erfunden, den Stier zu Fuß statt vom Pferd zu bekämpfen – der Stil, den man heute kennt.&quot;</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;tarifa&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M6 22 q6 -6 12 0 t12 0&quot;/><path d=&quot;M6 30 q6 -6 12 0 t12 0&quot;/><path d=&quot;M24 8 q10 2 6 12&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 05</div><h2>Tarifa</h2></div></div><p class=&quot;intro&quot;>Euer Basislager an der Südspitze Europas: zwei Meere, zwei Kontinente, endloser Wind – die Kite- und Wingfoil-Hauptstadt Europas.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Tarifa</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wo Europa aufhört und der Wind regiert.</p><ul class=&quot;facts&quot;><li><b>~18.000</b> Einwohner – klein, jung, entspannt, sehr international.</li><li><b>Südlichster Punkt des europäischen Festlands.</b></li><li>Hier trifft der <b>Atlantik</b> aufs <b>Mittelmeer</b>; <b>Afrika ~14 km</b> entfernt und oft sichtbar.</li><li>Zwei Winde bestimmen alles: <b>Levante</b> (Ost, stark/böig) und <b>Poniente</b> (West, sanfter).</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Euer Resort liegt in Valdevaqueros – direkt an der ION-Surfstation und der berühmten Riesendüne.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Geografie</span><span class=&quot;stitle&quot;>Isla de las Palomas</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Der echte Süd-Zipfel – zwei Meere an einer Linie.</p><ul class=&quot;facts&quot;><li>Ein Damm führt zur kleinen Insel – dem <b>südlichsten Punkt</b> des Kontinents.</li><li>Eine gedachte Linie hier trennt <b>Atlantik &amp;amp; Mittelmeer</b>.</li><li>Von hier ist Marokko an klaren Tagen zum Greifen nah.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Ich stehe am südlichsten Zipfel des europäischen Festlands – da drüben ist ein anderer Kontinent.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Natur</span><span class=&quot;stitle&quot;>Orcas &amp;amp; Wale in der Meerenge</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Die Straße von Gibraltar ist eine Tier-Autobahn.</p><ul class=&quot;facts&quot;><li>Im Sommer jagen hier <b>Orcas</b> den Roten Thunfisch – teils im Duell mit den Anglern um denselben Fisch.</li><li>Ganzjährig ziehen <b>Delfine, Grind- und Pottwale</b> durch die Enge.</li><li>Zudem eine der wichtigsten <b>Vogelzug-Routen</b> der Welt (Störche &amp;amp; Greifvögel Richtung Afrika).</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Orcas klauen den Fischern hier den Thunfisch direkt von der Angel.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Geschichte</span><span class=&quot;stitle&quot;>Burg &amp;amp; die Legende Guzmán</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Der Mann, der lieber seinen Sohn opferte.</p><ul class=&quot;facts&quot;><li>Name „Tarifa&quot; kommt von <b>Tarif ibn Malik</b>; <b>711</b> begann in der Nähe die maurische Eroberung Spaniens.</li><li>1294 hielten Feinde Guzmáns Sohn als Geisel: Burg übergeben oder der Sohn stirbt. Guzmán <b>warf sein eigenes Messer</b> von der Mauer.</li><li>Seither heißt er <b>„Guzmán el Bueno&quot;</b> – der Gute.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Er opferte lieber seinen Sohn als die Burg – und wurde dafür ‚der Gute’ genannt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Aktivität</span><span class=&quot;stitle&quot;>Wingfoilen &amp;amp; Kiten</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Warum die halbe Welt zum Wind hierher pilgert.</p><ul class=&quot;facts&quot;><li>Tarifa hat an ~<b>300 Tagen</b> im Jahr Wind – die Meerenge wirkt wie eine <b>Düse</b>.</li><li><b>Poniente</b> (West) ist sauberer &amp;amp; anfängerfreundlicher, <b>Levante</b> (Ost) stärker &amp;amp; böiger.</li><li>Wingfoilen: Board mit <b>Tragflügel (Foil)</b> unter Wasser – ab genug Tempo hebt das Board ab und „fliegt&quot; fast lautlos.</li><li>Entscheidung morgens per <b>Windguru/Windy</b> – wir bleiben flexibel.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Unser Stil</span><p>1–3 kurze Fenster, kein Zwang. Lieber ein gutes Erlebnis als stundenlang auf Wind warten.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Aktivität</span><span class=&quot;stitle&quot;>Quadtour durch die Dünen</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Staubige Runde für die Jungs.</p><ul class=&quot;facts&quot;><li>Rund um <b>Punta Paloma</b> und die Dünen – Wege durch Pinien, Strand und Aussichtspunkte.</li><li>Beni &amp;amp; Maxi fahren hinten mit (Alter vorab mit dem Anbieter klären).</li><li>2-Stunden-Tour lohnt mehr als die kurze Runde.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Kultur</span><span class=&quot;stitle&quot;>Feria &amp;amp; Cabalgata</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wenn die ganze Stadt zu Pferd feiert.</p><ul class=&quot;facts&quot;><li>Eine <b>Feria</b> ist ein mehrtägiges Volksfest: <b>Casetas</b> (Festzelte), Sevillanas-Tanz, Reiter, Lichter, Musik bis früh.</li><li>Höhepunkt am <b>So 06.09.</b>: die <b>Cabalgata Agrícola</b> – <b>500–700 Reiter</b> und geschmückte Kutschen bringen die Schutzpatronin (Virgen de la Luz) in die Stadt.</li><li>Ausgezeichnet als „Fiesta de Interés Turístico&quot;.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Bei so einer Feria kann eine ganze Stadt tagelang durchfeiern – morgens sind die Straßen voller Pferde.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Römer (Bolonia)</span><span class=&quot;stitle&quot;>Baelo Claudia</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Eine Römerstadt, die von stinkender Soße lebte.</p><ul class=&quot;facts&quot;><li>Gut erhaltene <b>Römerstadt</b> direkt am türkisen Strand, neben einer <b>riesigen Wanderdüne</b>.</li><li>Wurde reich mit <b>Garum</b> – vergorener Fischsoße, dem „Ketchup der Römer&quot;.</li><li>Wir nehmen ggf. nur die <b>Düne</b> mit.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Gutes Garum war teurer als Parfüm – aus fauligem Fisch.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Küste: Thunfisch &amp;amp; Fisch</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Fez’ großer Auftritt.</p><ul class=&quot;facts&quot;><li><b>Atún rojo</b> (Roter Thunfisch) aus der <b>Almadraba</b> – einer uralten Thunfisch-Fangtechnik der Phönizier/Römer.</li><li><b>Tortillitas de camarones</b>: knusprige Krabben-Pfannkuchen.</li><li>Für die Familie gibt es überall <b>Fleisch &amp;amp; Pasta</b> – für Fez endlich den frischen Fisch/Thunfisch.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Euer Plan</span><p>El Guapo, Vaca Loca (Rind!), Malcriado – alle mit Fleisch für die Family und Fisch für Fez.</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;gibraltar&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M5 34 L18 10 L24 20 L30 14 L35 34 Z&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 06</div><h2>Gibraltar</h2></div></div><p class=&quot;intro&quot;>Ein Stück Großbritannien am Fuß Afrikas: ein 426 m hoher Kalkfelsen, Affen, Pässe – und eine ganz andere Währung.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Gibraltar</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Britisch, aber mitten im Süden Spaniens.</p><ul class=&quot;facts&quot;><li><b>~32.000</b> Einwohner auf nur <b>~6,8 km²</b> – ein <b>britisches Überseegebiet</b> seit 1713.</li><li>Man zahlt eigentlich in <b>Pfund (£)</b>, Euro werden aber meist akzeptiert.</li><li>Ihr braucht den <b>Reisepass</b>, parkt in La Línea und geht zu Fuß über die Grenze.</li><li>Kurios: Der Fußweg quert die <b>Start-/Landebahn</b> des Flughafens – bei Flugverkehr sperrt eine Schranke.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Grenzstau ist nachmittags/abends am schlimmsten – früh rüber.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Der Felsen</span><span class=&quot;stitle&quot;>The Rock, Höhle &amp;amp; Affen</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Das Ende der antiken Welt – bewacht von Affen.</p><ul class=&quot;facts&quot;><li>Für die Antike war der Felsen eine der <b>„Säulen des Herakles&quot;</b> – dahinter das Unbekannte („non plus ultra&quot;).</li><li>Die <b>Berberaffen</b> sind die einzigen <b>wildlebenden Affen Europas</b>.</li><li>Legende: Verschwinden die Affen, verlieren die Briten den Felsen – im 2. Weltkrieg ließ <b>Churchill</b> extra Affen nachliefern.</li><li>Im Inneren: die riesige Tropfstein-Höhle <b>St. Michael’s Cave</b> und über <b>50 km</b> Kriegs-Tunnel.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Churchill nahm eine Affen-Legende so ernst, dass er mitten im Krieg Affen-Nachschub bestellte.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Tipp</span><span class=&quot;stitle&quot;>Main Street</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Steuerfreies Shopping unter der Union Jack.</p><ul class=&quot;facts&quot;><li>Die Fußgängerzone ist <b>zollfrei</b> – Parfüm, Elektronik, Süßes oft günstiger.</li><li>Rote Telefonzellen, Fish &amp;amp; Chips, Pubs – plötzlich fühlt es sich britisch an.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Achtung</span><p>Affen NICHT füttern und Taschen/Essen wegpacken – sie klauen blitzschnell.</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;cadiz&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><circle cx=&quot;20&quot; cy=&quot;18&quot; r=&quot;9&quot;/><path d=&quot;M20 27 V36&quot;/><path d=&quot;M13 33 h14&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 07</div><h2>Cádiz</h2></div></div><p class=&quot;intro&quot;>Vermutlich die älteste noch bewohnte Stadt Westeuropas – eine sonnengebleichte Halbinsel, fast rundum vom Atlantik umspült.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Cádiz</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Über 3.000 Jahre alt – und quicklebendig.</p><ul class=&quot;facts&quot;><li><b>~110.000</b> Einwohner auf einer schmalen <b>Halbinsel</b>, fast vom Meer umschlossen.</li><li>Von den <b>Phöniziern um 1100 v. Chr.</b> gegründet – die <b>älteste Stadt Westeuropas</b>.</li><li>Kompakte Altstadt – in einem Halbtag gut erlebbar.</li><li>Berühmt für seinen witzig-frechen <b>Karneval</b> (Chirigotas – Spott-Gesangsgruppen).</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Küstenstadt = deutlich kühler als das Inland. Abends an La Caleta besonders schön.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Uralt</span><span class=&quot;stitle&quot;>3.000 Jahre am Meer</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Älter als Rom – und Startrampe für Amerika.</p><ul class=&quot;facts&quot;><li>Über <b>3.000 Jahre</b> durchgehend bewohnt.</li><li><b>Kolumbus</b> stach von hier zu zwei seiner Amerika-Reisen in See.</li><li>Ganz in der Nähe (Sanlúcar) endete <b>Magellans Weltumseglung</b> 1522 – nach 3 Jahren kam 1 Schiff mit 18 Mann zurück.</li><li>La Caleta, die kleine Bucht, war Kulisse in einem <b>James-Bond-Film</b> („Stirb an einem anderen Tag&quot;).</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Als Rom gegründet wurde, war Cádiz schon über 300 Jahre alt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Pescaíto frito</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Cádiz lebt vom Meer.</p><ul class=&quot;facts&quot;><li><b>Pescaíto frito</b>: verschiedene kleine Fische, in Kichererbsenmehl frittiert – Fez’ Paradies.</li><li><b>Tortillitas de camarones</b> (Krabben-Pfannkuchen) kommen von hier.</li><li>Für die Family gibt es Fleisch/Iberico – euer Casa Lazo kann beides.</li></ul></div></details></section><section class=&quot;chapter&quot; id=&quot;trafalgar&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M20 5 V31&quot;/><rect x=&quot;17&quot; y=&quot;31&quot; width=&quot;6&quot; height=&quot;4&quot;/><path d=&quot;M13 35 h14&quot;/><path d=&quot;M20 10 l9 4 -9 4&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 08</div><h2>Vejer &amp;amp; Trafalgar</h2></div></div><p class=&quot;intro&quot;>Ein schneeweißes Bergdorf über der Küste – und daneben das Kap, an dem sich 1805 die Weltgeschichte entschied.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Vejer</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Eines der schönsten weißen Dörfer Spaniens.</p><ul class=&quot;facts&quot;><li><b>~13.000</b> Einwohner, auf einem Hügel über der Costa de la Luz.</li><li>Verwinkeltes maurisches Gassen-Labyrinth, komplett weiß gekalkt.</li><li>Bekannt für die „<b>Cobijadas</b>&quot; – Frauen, die sich früher fast komplett in schwarze Tücher hüllten.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Timing</span><p>Restaurantküchen öffnen erst ~20:00 – erst bummeln, dann Trafalgar-Sonnenuntergang, dann spät essen.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Seeschlacht</span><span class=&quot;stitle&quot;>Cap Trafalgar, 1805</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Vor diesem Leuchtturm wurde 100 Jahre Seeherrschaft entschieden.</p><ul class=&quot;facts&quot;><li><b>1805</b> schlug der britische Admiral <b>Nelson</b> hier die vereinte französisch-spanische Flotte.</li><li>Er gewann haushoch – wurde aber im Kampf <b>tödlich getroffen</b>.</li><li>Danach beherrschte <b>Großbritannien</b> rund 100 Jahre die Weltmeere.</li><li>Der Sonnenuntergang am Leuchtturm ist einer der schönsten der Küste.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Der Trafalgar Square in London ist nach genau diesem Kap benannt.&quot;</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;frigiliana&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><path d=&quot;M7 34 V22 l7 -5 v17&quot;/><path d=&quot;M14 34 V17 l8 -6 v23&quot;/><path d=&quot;M22 34 V11 l8 6 v17&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 09</div><h2>Frigiliana</h2></div></div><p class=&quot;intro&quot;>Oft zum schönsten weißen Dorf Spaniens gewählt – kurzer Zwischenstopp auf dem Weg nach Granada (Provinz Málaga, nicht Granada).</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Frigiliana</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Klein, weiß, maurisch – ein Postkartenmotiv.</p><ul class=&quot;facts&quot;><li><b>~3.000</b> Einwohner, in den Bergen über der Costa del Sol (Prov. <b>Málaga</b>).</li><li>Mehrfach zum <b>schönsten Dorf Andalusiens</b> gekürt.</li><li>Weiß gekalkte Häuser, Blumentöpfe, steile Kopfsteinpflaster-Gassen.</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Weißes Dorf</span><span class=&quot;stitle&quot;>Gassen &amp;amp; Rebellion</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Weiß gegen die Hitze, mit maurischem Herz.</p><ul class=&quot;facts&quot;><li>Die Häuser sind <b>weiß gekalkt</b> – reflektiert die Sonne, hält innen kühl.</li><li>Hier fand <b>1569</b> eine der letzten <b>Morisken-Rebellionen</b> statt (muslimische Bewohner gegen die Krone).</li><li>Bunte Keramik-Tafeln in den Gassen erzählen diese Geschichte.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Das verwinkelte Gassen-Wirrwarr ist maurisch – gebaut, um Angreifer zu verwirren.&quot;</p></div></div></details></section><section class=&quot;chapter&quot; id=&quot;granada&quot;><div class=&quot;chead&quot;><svg class=&quot;emblem&quot; viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot;><circle cx=&quot;20&quot; cy=&quot;22&quot; r=&quot;11&quot;/><path d=&quot;M20 11 V6&quot;/><path d=&quot;M16 7 h8&quot;/><path d=&quot;M15 20 l3 3 4 -5 3 4&quot; stroke-width=&quot;1.6&quot;/></svg><div><div class=&quot;cnum&quot;>KAPITEL 10</div><h2>Granada</h2></div></div><p class=&quot;intro&quot;>Das große Finale: am Fuß der schneebedeckten Sierra Nevada thront die Alhambra – der schönste maurische Palast der Welt.</p><div class=&quot;rule&quot;></div><details><summary><span class=&quot;stype&quot;>Steckbrief</span><span class=&quot;stitle&quot;>Überblick Granada</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Wo das maurische Spanien endete – und ewig weiterlebt.</p><ul class=&quot;facts&quot;><li><b>~230.000</b> Einwohner, am Fuß der <b>Sierra Nevada</b> (höchste Gipfel Festland-Spaniens, im Winter Skigebiet).</li><li>„Granada&quot; heißt <b>Granatapfel</b> – die Frucht ist im Stadtwappen.</li><li>Große <b>Studentenstadt</b> mit lebendiger Altstadt.</li><li>Berühmt: Man bekommt hier zu jedem Getränk <b>gratis Tapas</b> dazu – eine der letzten Städte mit dieser Tradition.</li></ul><div class=&quot;note&quot;><span class=&quot;lbl&quot;>Merke</span><p>Nasriden-Slot 10:00 ist strikt – pünktlich sein. Morgens ist die Alhambra kühler &amp;amp; leerer.</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Die Alhambra</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Die „rote Burg&quot; – das letzte Maurenreich Europas.</p><ul class=&quot;facts&quot;><li>Name von arabisch <b>al-qal’a al-hamra</b> = „die rote Festung&quot;.</li><li>Raffinierte <b>Wasserkunst</b>: Brunnen und Kanäle kühlen ganz ohne Strom, per Schwerkraft aus der Sierra.</li><li><b>1492</b> übergab König <b>Boabdil</b> die Schlüssel an die Katholischen Könige – Ende von <b>780 Jahren</b> muslimischem Spanien.</li><li>Der US-Autor <b>Washington Irving</b> wohnte in den Ruinen und machte die Alhambra mit „Tales of the Alhambra&quot; weltberühmt.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Im selben Jahr, in dem hier das letzte Maurenreich fiel, segelte Kolumbus los – bezahlt von denselben Königen.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Highlight</span><span class=&quot;stitle&quot;>Nasridenpaläste</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Der wertvollste Teil – filigran wie Spitze aus Gips.</p><ul class=&quot;facts&quot;><li>Die eigentlichen Wohn- und Thronsäle der maurischen Herrscher.</li><li>Wände voller Stuck, Fliesen und arabischer Kalligrafie – oft der Spruch „Nur Gott ist Sieger&quot;.</li><li>Der <b>Löwenhof</b> mit 12 Marmorlöwen ist das Wahrzeichen.</li><li>Strenger Zeitslot (bei euch 10:00) – nur eine begrenzte Zahl darf gleichzeitig rein.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Man sagt, hier sieht Stein aus wie Vorhänge aus Spitze – alles nur aus Gips gemeißelt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Legende</span><span class=&quot;stitle&quot;>Der letzte Seufzer des Mauren</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Ein Abschied, über den man heute noch spricht.</p><ul class=&quot;facts&quot;><li>Auf der Flucht drehte sich Boabdil um und <b>weinte</b> beim letzten Blick auf die Alhambra.</li><li>Seine Mutter soll gesagt haben: <b>„Wein wie eine Frau um das, was du als Mann nicht verteidigen konntest.&quot;</b></li><li>Der Pass heißt bis heute <b>„El Suspiro del Moro&quot;</b> – der Seufzer des Mauren.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Es gibt einen Ort auf der Landkarte, der offiziell ‚Der Seufzer des Mauren’ heißt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Viertel</span><span class=&quot;stitle&quot;>Albaicín &amp;amp; Sacromonte</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Weißes Labyrinth und Höhlen-Flamenco.</p><ul class=&quot;facts&quot;><li>Der <b>Albaicín</b> ist das alte maurische Viertel – vom <b>Mirador San Nicolás</b> der beste Blick auf die Alhambra.</li><li>Im <b>Sacromonte</b> wohnten Roma in <b>Höhlen</b> im Berg – Geburtsort der wilden Flamenco-Art „Zambra&quot;.</li><li>Beide Viertel sind UNESCO-Welterbe.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„In Sacromonte wird bis heute in echten Wohnhöhlen im Berg Flamenco getanzt.&quot;</p></div></div></details><details><summary><span class=&quot;stype&quot;>Aktivität</span><span class=&quot;stitle&quot;>Sacromonte-Zambra &amp;amp; Hammam</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Ideen für den letzten Abend.</p><ul class=&quot;facts&quot;><li><b>Zambra</b>: intime Flamenco-Vorstellung in einer Höhle – hautnah und archaisch.</li><li><b>Hammam Al Ándalus</b>: arabische Bäder mit warmen Becken – entspannter Abschluss (Reservierung nötig).</li></ul></div></details><details><summary><span class=&quot;stype&quot;>Küche</span><span class=&quot;stitle&quot;>Was man in Granada isst</span><span class=&quot;chev&quot;>&amp;rsaquo;</span></summary><div class=&quot;body&quot;><p class=&quot;hook&quot;>Kostenlose Tapas &amp;amp; süße Klöster-Rezepte.</p><ul class=&quot;facts&quot;><li>Zu jedem Getränk kommt eine <b>Gratis-Tapa</b> – je mehr Runden, desto besser das Häppchen.</li><li><b>Piononos</b>: kleine, in Sirup getränkte Zimtröllchen (aus Santa Fe bei Granada).</li><li><b>Habas con jamón</b>: dicke Bohnen mit Schinken.</li><li>Euer Gehoben-Abend: <b>Atelier Casa de Comidas</b> (Bib Gourmand) – Diät vorab anmelden.</li></ul><div class=&quot;brag&quot;><span class=&quot;lbl&quot;>Angeber-Wissen</span><p>„Granada ist eine der letzten Städte Spaniens, in der Tapas zum Getränk noch gratis sind.&quot;</p></div></div></details></section>

<div class=&quot;info&quot;><h3>Die 6 wichtigsten Regeln (Spanien)</h3><ul>
<li><b>j</b> und <b>g</b> (vor e/i) = kratziges „ch&quot; wie in <i>ach</i>: <b>jamón</b> „cha-MON&quot;, <b>gente</b> „CHEN-te&quot;.</li>
<li><b>ll</b> und <b>y</b> = „j&quot; wie in <i>ja</i>: <b>llave</b> „JA-we&quot;, <b>paella</b> „pa-E-ja&quot;.</li>
<li><b>ñ</b> = „nj&quot;: <b>España</b> „es-PAN-ja&quot;.</li>
<li><b>z</b> und <b>c</b> (vor e/i) = englisches „th&quot;: <b>gracias</b> „GRA-thias&quot;, <b>cerveza</b> „ther-WE-tha&quot;.</li>
<li><b>h</b> ist stumm (<b>hola</b> „OLA&quot;), <b>v</b> klingt fast wie <b>b</b>.</li>
<li>Betonung meist auf der <b>vorletzten Silbe</b> – Akzent (á, í …) zeigt Ausnahmen. GROSS = betont in der Lautschrift.</li>
</ul></div>
<div class=&quot;info&quot; style=&quot;background:var(--gold-tint);border-color:var(--gold)&quot;><h3>So nutzt du den Trainer</h3><ul>
<li>Auf eine Karte tippen = <b>vorlesen</b> (spanische Handy-Stimme, Spanien-Aussprache).</li>
<li>Oben <b>„Übungsmodus&quot;</b>: Spanisch wird versteckt – Karte antippen deckt auf (Selbsttest).</li>
<li>Braucht eine spanische Stimme auf dem iPhone (ist ab Werk dabei).</li>

var wrap=document.getElementById('wrap');
function pickVoice(){var vs=window.speechSynthesis?speechSynthesis.getVoices():[];return vs.find(function(v){return v.lang&amp;&amp;v.lang.toLowerCase().indexOf('es')===0;});}
function speak(t){try{if(!('speechSynthesis'in window))return;var u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;var v=pickVoice();if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=function(){};}
document.querySelectorAll('.ph').forEach(function(ph){ph.addEventListener('click',function(e){var es=this.getAttribute('data-es');if(e.target.closest('.say')){speak(es);return;}if(wrap.classList.contains('practice')){this.classList.toggle('revealed');}else{speak(es);}});});
document.querySelectorAll('.numgrid .n').forEach(function(n){n.addEventListener('click',function(){speak(this.getAttribute('data-es'));});});
document.querySelectorAll('.dialog .es').forEach(function(l){l.addEventListener('click',function(){var es=this.getAttribute('data-es');if(es)speak(es);});l.style.cursor='pointer';});
document.getElementById('practiceBtn').addEventListener('click',function(){var on=wrap.classList.toggle('practice');this.textContent=on?'Lernmodus':'Übungsmodus';document.querySelectorAll('.ph.revealed,.reply.revealed').forEach(function(x){x.classList.remove('revealed');});});
</script></body></html>"></iframe>

   menu.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){
     var p=b.getAttribute('data-p');
     document.querySelectorAll('.frame').forEach(function(f){f.classList.remove('active');});
     document.getElementById(ids[p]).classList.add('active');
     pt.textContent=names[p];
